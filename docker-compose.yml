version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cooperative_gig_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cooperative_gig
      POSTGRES_USER: gig_user
      POSTGRES_PASSWORD: gig_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gig_user -d cooperative_gig"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
