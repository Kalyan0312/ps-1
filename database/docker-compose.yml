version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: cooperative_gig_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: cooperative_gig
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cooperative_gig"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
